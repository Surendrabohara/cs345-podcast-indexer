<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Podcast &amp; Interview Indexer</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1b1b1b; }
    h1 { font-size: 1.4rem; }
    section { border: 1px solid #d8d8d8; border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; }
    input, button { font: inherit; padding: .45rem .6rem; margin: .2rem .2rem .2rem 0; }
    .hit { border-top: 1px solid #eee; padding: .7rem 0; }
    .meta { color: #666; font-size: .85rem; }
    .time { font-weight: 600; }
    .tag { display: inline-block; background: #eef2ff; border-radius: 4px; padding: 0 .4rem; margin-right: .3rem; font-size: .8rem; }
    #status { color: #555; }
  </style>
</head>
<body>
  <h1>Podcast &amp; Interview Indexer</h1>

  <section>
    <strong>1. Add a recording</strong><br>
    <input type="file" id="audio" accept="audio/*">
    <button id="rec">Record</button> <span id="recnote" class="meta"></span><br>
    <input type="text" id="title" placeholder="Title (optional)">
    <select id="voice"></select>
    <button id="upload">Submit</button>
    <div id="status"></div>
    <div id="out" style="display:none">
      <audio id="player" controls></audio>
      <div id="spoken" class="meta"></div>
      <p id="transcript"></p>
      <div id="tags"></div>
    </div>
  </section>

  <section>
    <strong>2. Search</strong><br>
    <input type="text" id="q" placeholder="Topic or name">
    <input type="text" id="person" placeholder="Person filter">
    <input type="text" id="topic" placeholder="Topic filter">
    <button id="go">Search</button>
    <div id="summary" class="meta"></div>
    <div id="results"></div>
  </section>

  <section>
    <strong>Episodes</strong>
    <div id="episodes" class="meta"></div>
  </section>

<script>
const $ = (id) => document.getElementById(id);
const mmss = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0");

async function loadEpisodes() {
  const eps = await (await fetch("/episodes")).json();
  $("episodes").textContent = eps.length
    ? eps.map(e => `${e.title} (${mmss(e.duration_seconds)}, ${e.segments} segments)`).join(" | ")
    : "None yet.";
}

let recorder = null, chunks = [], recorded = null;
$("rec").onclick = async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      recorded = new File([new Blob(chunks, { type: recorder.mimeType })], "recording.webm");
      $("rec").textContent = "Record";
      $("recnote").textContent = "Recorded. Press Submit.";
    };
    recorder.start();
    $("rec").textContent = "Stop";
    $("recnote").textContent = "Recording...";
  } catch (err) {
    $("recnote").textContent = "Microphone not available (needs HTTPS or localhost).";
  }
};

(async () => {
  const voices = await (await fetch("/voices")).json();
  for (const v of voices) {
    const o = document.createElement("option");
    o.value = v.voice;
    o.textContent = `${v.style} (${v.voice.replace("en-US-", "").replace("Neural", "")})`;
    $("voice").append(o);
  }
})();

$("upload").onclick = async () => {
  const file = recorded || $("audio").files[0];
  if (!file) { $("status").textContent = "Record or choose an audio file first."; return; }
  const form = new FormData();
  form.append("audio", file);
  form.append("title", $("title").value);
  form.append("voice", $("voice").value);
  $("status").textContent = "Working. This takes about as long as the recording...";
  let res, body;
  try {
    res = await fetch("/process", { method: "POST", body: form });
    body = await res.json();
  } catch (err) {
    $("status").textContent = "Error: the server could not process this recording. Try again.";
    return;
  }
  if (!res.ok) { $("status").textContent = `Error: ${body.error || res.status}`; $("out").style.display = "none"; return; }
  $("status").textContent = `Done: ${body.title}, sentiment ${body.sentiment.label}, ${body.entity_count} entities`;
  $("out").style.display = "block";
  $("player").src = "data:audio/mpeg;base64," + body.audio_base64;
  $("spoken").textContent = body.summary_text;
  $("transcript").textContent = body.transcript;
  const tags = $("tags");
  tags.textContent = "";
  const seen = new Set();
  for (const seg of body.segments) for (const e of seg.entities) {
    const key = e.category + e.text;
    if (seen.has(key)) continue;
    seen.add(key);
    const s = document.createElement("span");
    s.className = "tag";
    s.textContent = `${e.text} (${e.category})`;
    tags.append(s);
  }
  loadEpisodes();
};

$("go").onclick = async () => {
  const params = new URLSearchParams({ q: $("q").value });
  if ($("person").value) params.set("person", $("person").value);
  if ($("topic").value) params.set("topic", $("topic").value);
  const data = await (await fetch("/search?" + params)).json();
  $("summary").textContent = `${data.results.length} result(s) in ${data.latency_ms} ms`;
  const box = $("results");
  box.textContent = "";
  for (const h of data.results) {
    const div = document.createElement("div");
    div.className = "hit";
    const head = document.createElement("div");
    const t = document.createElement("span");
    t.className = "time";
    t.textContent = mmss(h.start_sec);
    head.append(t, " in ", h.episode_title);
    const body = document.createElement("div");
    body.textContent = h.text;
    const tags = document.createElement("div");
    tags.className = "meta";
    for (const p of h.people) { const s = document.createElement("span"); s.className = "tag"; s.textContent = p; tags.append(s); }
    for (const x of h.topics) { const s = document.createElement("span"); s.className = "tag"; s.textContent = x; tags.append(s); }
    div.append(head, body, tags);
    box.append(div);
  }
};

loadEpisodes();
</script>
</body>
</html>
